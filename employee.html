<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Employee Dashboard - Submit and Track Leave Requests">
  <title>Employee Dashboard | Leave Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="p-3 border-bottom border-secondary">
    <div class="d-flex align-items-center gap-2">
      <div class="bg-primary text-white rounded-2 d-flex align-items-center justify-content-center" style="width:36px;height:36px;">
        <i class="bi bi-calendar-check"></i>
      </div>
      <span class="text-white fw-bold">Leave<span class="text-primary-subtle">Management</span></span>
    </div>
  </div>

  <nav class="nav flex-column mt-3 flex-grow-1">
    <small class="text-uppercase text-secondary px-3 mb-1" style="font-size:11px;letter-spacing:1px;">Menu</small>
    <a href="employee.html" class="nav-link active">
      <i class="bi bi-grid me-2"></i> Dashboard
    </a>
  </nav>

  <div class="p-3 border-top border-secondary">
    <button class="btn btn-outline-danger btn-sm w-100" onclick="logout()">
      <i class="bi bi-box-arrow-left me-1"></i> Logout
    </button>
  </div>
</aside>

<!-- Sidebar Overlay (Mobile) -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<!-- Navbar -->
<nav class="navbar-top navbar navbar-light bg-white border-bottom px-3">
  <div class="d-flex align-items-center gap-2">
    <button class="btn btn-outline-secondary btn-sm d-md-none btn-hamburger" onclick="toggleSidebar()" style="display:none;">
      <i class="bi bi-list"></i>
    </button>
    <h5 class="mb-0 fw-bold">Employee <span class="text-primary">Dashboard</span></h5>
  </div>
  <div class="d-flex align-items-center gap-3">
    <button class="btn btn-outline-danger btn-sm" onclick="logout()">
      <i class="bi bi-box-arrow-left me-1"></i> Logout
    </button>
  </div>
</nav>

<!-- Main Content -->
<main class="main-content">
  <!-- Submit Leave Card -->
  <div class="card border-0 shadow-sm mb-4">
    <div class="card-header bg-white py-3">
      <h6 class="mb-0 fw-bold"><i class="bi bi-plus-circle me-2 text-primary"></i>Submit Leave Request</h6>
    </div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold" for="start_date">Start Date</label>
          <input id="start_date" type="date" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold" for="end_date">End Date</label>
          <input id="end_date" type="date" class="form-control">
        </div>
        <div class="col-12">
          <label class="form-label fw-semibold" for="reason">Reason</label>
          <input id="reason" class="form-control" placeholder="Enter reason for leave">
        </div>
        <div class="col-12">
          <button class="btn btn-primary fw-semibold" onclick="submitLeave()">
            <i class="bi bi-send me-1"></i> Submit Request
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- My Leaves Table -->
  <div class="card border-0 shadow-sm">
    <div class="card-header bg-white py-3">
      <h6 class="mb-0 fw-bold"><i class="bi bi-clock-history me-2 text-primary"></i>My Leave History</h6>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Start Date</th>
              <th>End Date</th>
              <th>Total Days</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="leaveTable"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/employee.js"></script>
</body>
</html>
