<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Admin Dashboard - Manage Leave Requests">
  <title>Admin Dashboard | Leave Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="p-3 border-bottom border-secondary">
    <div class="d-flex align-items-center gap-2">
      <div class="bg-primary text-white rounded-2 d-flex align-items-center justify-content-center" style="width:36px;height:36px;">
        <i class="bi bi-calendar-check"></i>
      </div>
      <span class="text-white fw-bold">Leave<span class="text-primary-subtle">Management</span></span>
    </div>
  </div>

  <nav class="nav flex-column mt-3 flex-grow-1">
    <small class="text-uppercase text-secondary px-3 mb-1" style="font-size:11px;letter-spacing:1px;">Menu</small>
    <a href="admin.html" class="nav-link active">
      <i class="bi bi-grid me-2"></i> Dashboard
    </a>
  </nav>

  <div class="p-3 border-top border-secondary">
    <button class="btn btn-outline-danger btn-sm w-100" onclick="logout()">
      <i class="bi bi-box-arrow-left me-1"></i> Logout
    </button>
  </div>
</aside>

<!-- Sidebar Overlay (Mobile) -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<!-- Navbar -->
<nav class="navbar-top navbar navbar-light bg-white border-bottom px-3">
  <div class="d-flex align-items-center gap-2">
    <button class="btn btn-outline-secondary btn-sm d-md-none btn-hamburger" onclick="toggleSidebar()" style="display:none;">
      <i class="bi bi-list"></i>
    </button>
    <h5 class="mb-0 fw-bold">Admin <span class="text-primary">Dashboard</span></h5>
  </div>
  <div class="d-flex align-items-center gap-3">
    <button class="btn btn-outline-danger btn-sm" onclick="logout()">
      <i class="bi bi-box-arrow-left me-1"></i> Logout
    </button>
  </div>
</nav>

<!-- Main Content -->
<main class="main-content">
  <!-- Stats Cards -->
  <div class="row g-3 mb-4">
    <div class="col-sm-6 col-xl-3">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body d-flex align-items-center gap-3">
          <div class="bg-primary bg-opacity-10 text-primary rounded-3 d-flex align-items-center justify-content-center" style="width:48px;height:48px;font-size:20px;">
            <i class="bi bi-clipboard-data"></i>
          </div>
          <div>
            <div class="fs-4 fw-bold" id="totalRequests">0</div>
            <div class="text-muted small">Total Requests</div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-sm-6 col-xl-3">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body d-flex align-items-center gap-3">
          <div class="bg-warning bg-opacity-10 text-warning rounded-3 d-flex align-items-center justify-content-center" style="width:48px;height:48px;font-size:20px;">
            <i class="bi bi-hourglass-split"></i>
          </div>
          <div>
            <div class="fs-4 fw-bold" id="pendingCount">0</div>
            <div class="text-muted small">Pending</div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-sm-6 col-xl-3">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body d-flex align-items-center gap-3">
          <div class="bg-success bg-opacity-10 text-success rounded-3 d-flex align-items-center justify-content-center" style="width:48px;height:48px;font-size:20px;">
            <i class="bi bi-check-circle"></i>
          </div>
          <div>
            <div class="fs-4 fw-bold" id="approvedCount">0</div>
            <div class="text-muted small">Approved</div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-sm-6 col-xl-3">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body d-flex align-items-center gap-3">
          <div class="bg-danger bg-opacity-10 text-danger rounded-3 d-flex align-items-center justify-content-center" style="width:48px;height:48px;font-size:20px;">
            <i class="bi bi-x-circle"></i>
          </div>
          <div>
            <div class="fs-4 fw-bold" id="rejectedCount">0</div>
            <div class="text-muted small">Rejected</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Leave Requests Table -->
  <div class="card border-0 shadow-sm">
    <div class="card-header bg-white py-3">
      <h6 class="mb-0 fw-bold">All Leave Requests</h6>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Employee</th>
              <th>Dates</th>
              <th>Total Days</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="adminTable"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
