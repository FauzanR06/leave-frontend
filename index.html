<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Leave Management System - Login">
  <title>Login | Leave Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-wrapper d-flex align-items-center justify-content-center">
  <div class="card shadow-lg border-0" style="width: 100%; max-width: 420px;">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <div class="bg-primary text-white rounded-3 d-inline-flex align-items-center justify-content-center mb-3" style="width:50px;height:50px;font-size:24px;">
          <i class="bi bi-calendar-check"></i>
        </div>
        <h4 class="fw-bold">Welcome Back</h4>
        <p class="text-muted small">Sign in to your leave management account</p>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold" for="employee_number">Employee Number</label>
        <input id="employee_number" class="form-control" placeholder="Enter your employee number" autocomplete="username">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold" for="password">Password</label>
        <input id="password" type="password" class="form-control" placeholder="Enter your password" autocomplete="current-password">
      </div>

      <button id="loginBtn" class="btn btn-primary w-100 fw-semibold" onclick="login()">
        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
      </button>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
